services:
  - type: web
    name: monogram-fullstack
    runtime: node
    plan: free
    buildCommand: corepack pnpm install --frozen-lockfile --prod=false && corepack pnpm run build
    startCommand: corepack pnpm start
    healthCheckPath: /api/healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVE_WEB
        value: "true"
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SESSION_SECRET
        generateValue: true
