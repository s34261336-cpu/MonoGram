kind = "web"
previewPath = "/"
title = "MonoGram"
description = "Русскоязычный мессенджер с входом по номеру телефона и демо-коду, личными чатами, каналами и статусом присутствия."
version = "1.0.0"
id = "artifacts/telegram-messenger"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20292

[services.development]
run = "pnpm --filter @workspace/telegram-messenger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/telegram-messenger", "run", "build" ]
serve = "static"
publicDir = "artifacts/telegram-messenger/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20292"
BASE_PATH = "/"
