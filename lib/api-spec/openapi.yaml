openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: chats
    description: Chat list and message history
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /chats:
    get:
      operationId: getChats
      tags: [chats]
      summary: List chats
      responses:
        "200":
          description: Chat list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Chat"
  /chats/{chatId}/messages:
    get:
      operationId: getChatMessages
      tags: [chats]
      summary: Get a chat's messages
      parameters:
        - name: chatId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Messages in the chat
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Message"
        "404":
          description: Chat not found
  /messages:
    post:
      operationId: sendMessage
      tags: [chats]
      summary: Send a message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Created message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
        "400":
          description: Invalid message
        "404":
          description: Chat not found
  /messenger/uploads/request-url:
    post:
      operationId: requestMessengerUploadUrl
      tags: [chats]
      summary: Request a private image upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RequestUploadUrlBody"
      responses:
        "200":
          description: Signed upload URL and private object path
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RequestUploadUrlResponse"
        "400":
          description: Invalid file metadata
        "401":
          description: Authentication required
  /messenger/messages/{messageId}/image:
    get:
      operationId: getMessengerMessageImage
      tags: [chats]
      summary: Get an image attached to a message
      parameters:
        - name: messageId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Image visible to conversation members
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        "401":
          description: Authentication required
        "404":
          description: Message or image not found
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    ChatPreview:
      type: object
      properties:
        text:
          type: string
        time:
          type: string
        fromMe:
          type: boolean
        read:
          type: boolean
      required: [text, time, fromMe, read]
    Chat:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        initials:
          type: string
        color:
          type: string
        online:
          type: boolean
        unreadCount:
          type: integer
        isGroup:
          type: boolean
        lastMessage:
          $ref: "#/components/schemas/ChatPreview"
      required: [id, name, initials, color, online, unreadCount, isGroup, lastMessage]
    Message:
      type: object
      properties:
        id:
          type: string
        chatId:
          type: string
        text:
          type: string
        createdAt:
          type: string
          format: date-time
        authorId:
          type: string
        authorName:
          type: string
        outgoing:
          type: boolean
        read:
          type: boolean
        kind:
          type: string
          enum: [text, file, voice]
        fileName:
          type: ["string", "null"]
      required: [id, chatId, text, createdAt, authorId, authorName, outgoing, read, kind, fileName]
    MessageInput:
      type: object
      properties:
        chatId:
          type: string
          minLength: 1
        text:
          type: string
          minLength: 1
          maxLength: 4000
        authorName:
          type: string
          minLength: 1
          maxLength: 80
        kind:
          type: string
          enum: [text, file, voice]
        fileName:
          type: string
      required: [chatId, text, authorName]
    RequestUploadUrlBody:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 160
        size:
          type: integer
          minimum: 1
          maximum: 10485760
        contentType:
          type: string
          enum: [image/jpeg, image/png, image/webp]
      required: [name, size, contentType]
    RequestUploadUrlResponse:
      type: object
      properties:
        uploadURL:
          type: string
          format: uri
        objectPath:
          type: string
          pattern: "^/supabase/uploads/[0-9a-f-]+/[0-9a-f-]+$"
      required: [uploadURL, objectPath]

